name: Checks
on:
  schedule:
    - cron: "5 */12 * * *"
  push:
    branches:
      - "master"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run script
        run: |
          bash .github/workflows/checks.sh
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN_PAT }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
