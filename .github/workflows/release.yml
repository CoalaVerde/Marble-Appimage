name: Release
on:
  schedule:
    - cron: "5 */12 * * *"
  push:
    branches:
      - "master"

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      FIREFOX_PRODUCT: 'marble'
      FIREFOX_OS: 'linux64'
      FIREFOX_LANG: 'en-US'
    steps:
    - uses: actions/checkout@v4


    - name: Build marble
      run: |
        bash build/build.sh
        echo "$FIREFOX_VERSION.r$FIREFOX_BUILD_ID"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: 'marble-continuous.AppImage'
        path: 'dist'

    - name: Release Tagged
      uses: marvinpinto/action-automatic-releases@latest
      with:
        title: marble v${{ env.FIREFOX_VERSION }}.r${{ env.FIREFOX_BUILD_ID }}
        automatic_release_tag: ${{ env.FIREFOX_PRODUCT }}-v${{ env.FIREFOX_VERSION }}.r${{ env.FIREFOX_BUILD_ID }}
        prerelease: true
        draft: false 
        files: |
          dist
        repo_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Release Continuous
      uses: marvinpinto/action-automatic-releases@latest
      with:
        title: Latest Continous build for marble v${{ env.FIREFOX_VERSION }}.r${{ env.FIREFOX_BUILD_ID }}
        automatic_release_tag: ${{ env.FIREFOX_PRODUCT }}
        prerelease: false
        draft: false 
        files: |
          dist
        repo_token: ${{ secrets.GITHUB_TOKEN }}

